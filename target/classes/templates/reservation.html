<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Reserve a Table</title></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main class="page-shell reservation-page"><section class="page-heading"><p class="eyebrow">Reserve a table</p><h1>Make it a good evening.</h1><p>Book a table for up to 10 guests. We confirm every reservation instantly.</p></section><section class="form-card"><form th:action="@{/reservations}" method="post"><div class="form-grid"><label>Full name<input required name="customerName"></label><label>Email<input required type="email" name="email"></label><label>Phone<input required type="tel" name="phone"></label><label>Date & time<input required type="datetime-local" name="dateTime"></label><label>Guests<select required name="partySize"><option value="1">1 guest</option><option value="2">2 guests</option><option value="3">3 guests</option><option value="4">4 guests</option><option value="5">5 guests</option><option value="6">6 guests</option><option value="7">7 guests</option><option value="8">8 guests</option><option value="9">9 guests</option><option value="10">10 guests</option></select></label><label>Special request<textarea name="notes" rows="3" placeholder="Birthday, accessibility needs, or seating preference"></textarea></label></div><button class="button" type="submit">Confirm reservation</button></form></section></main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
